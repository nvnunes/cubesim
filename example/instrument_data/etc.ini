[system]
name = CubeSim Example IFU

[telescope]
primary_diameter = 8.0
central_obscuration = 1.3
f_number = 32.5

[detector]
read_noise = 5.0
dark_current = 0.05
quantum_efficiency = 0.8

[scale.25mas]
spaxels_x = 40
spaxels_y = 40
spaxel_scale = 25

[scale.50mas]
spaxels_x = 40
spaxels_y = 40
spaxel_scale = 50

[scale.100mas]
spaxels_x = 40
spaxels_y = 40
spaxel_scale = 100

[disperser.r3000]
resolving_power = 3000
pixels_per_resolution_element = 2

[disperser.r3000.yj]
wavelength_min = 0.95
wavelength_max = 1.35

[disperser.r3000.jh]
wavelength_min = 1.25
wavelength_max = 1.80

[disperser.r3000.hk]
wavelength_min = 1.63
wavelength_max = 2.35

[disperser.r8000]
resolving_power = 8000
pixels_per_resolution_element = 2

[disperser.r8000.j]
wavelength_min = 1.19
wavelength_max = 1.35

[disperser.r8000.h]
wavelength_min = 1.50
wavelength_max = 1.71

[disperser.r8000.k]
wavelength_min = 2.11
wavelength_max = 2.38

[atmosphere.airmass10]
pwv = 1.0
airmass = 1.0
transmission_file = atmosphere/airmass10_transmission.ecsv
background_file = atmosphere/airmass10_background.ecsv

[atmosphere.airmass20]
pwv = 1.0
airmass = 2.0
transmission_file = atmosphere/airmass20_transmission.ecsv
background_file = atmosphere/airmass20_background.ecsv

[optics.telescope]
order = 1
throughput = 0.9
emissivity = 0.1
temperature = 275

[optics.ao_relay]
order = 2
throughput = 0.8
emissivity = 0.2
temperature = 275

[optics.ifu.r3000]
order = 3
throughput = 0.5
emissivity = 0.0

[optics.ifu.r8000]
order = 3
throughput = 0.3
emissivity = 0.0
